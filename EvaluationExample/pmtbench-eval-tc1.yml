# ============================================================
# PMTBench configuration file
# ============================================================
# This file defines the configuration parameters used by PMTBench.
# These parameters can also be provided through the command line.
# Command-line arguments override the values defined in this file.
#
# Example:
#   pmtbench --config config.yaml --seed 123
# ============================================================

# Configuration file version
config_version: 1

# ============================================================
# Filters
# ============================================================

filters:

  # Filter mutants by programming language. Example: python, java
  language:

  # Filter mutants by mutation tool. Example: Major_1.3.4, PIT_1.15.8
  tool:

  # Filter by citation source. Example: pmtbenchAL, zhao2024spotting
  citation:

  # List of project IDs to include
  # Example:
  # projects:
  #   - proj1
  #   - proj2
  projects:

  # Data blocks to include in the exported dataset
  # Available values:
  #   - staticAnalysis
  #   - execution
  #   - naturalLanguage
  #
  # Default: include all blocks
  blocks:
    - naturalLanguage

# ============================================================
# Reproducibility
# ============================================================

reproducibility:

  # Seed used to ensure deterministic execution
  seed: 42

# ============================================================
# Dataset partitioning
# ============================================================

partitioning:

  # Dataset split percentages. Values must sum to 100.
  # Two partitions (training/test):
  # partition: [90, 10]
  #
  # Three partitions (training/validation/test):
  # partition: [70, 15, 15]
  partition:

  # Project IDs assigned to the training split
  # Example:
  # train_projects:
  #   - proj1
  #   - proj2
  train_projects: Csv_1

  # Project IDs assigned to the validation split
  val_projects:

  # Project IDs assigned to the test split
  test_projects: Csv_5

  # Use previously generated training/validation/test
  # partition CSV files instead of creating new ones
  existing_data: false

  # Path to the training CSV file. Required if existing_data = true
  training_file:

  # Path to the test CSV file. Required if existing_data = true
  test_file:

# ============================================================
# Machine learning execution
# ============================================================

ml:

  # Path to the external Python script that executes the ML model
  # The script must accept the following arguments:
  #   --training_file
  #   --test_file
  #   --output_file
  #   --seed
  #
  # The output CSV file generated by the script must contain the following columns:
  #   - Project
  #   - True Label
  #   - Predicted Label
  # Optionally:
  #   - Killing Probability
  # Example: random_forest.py
  ml_script: EvaluationExample/sim_testcase_pred.py

  # Thresholds used for prediction aggregation
  # Example: thresholds: [0.10, 0.25, 0.50]
  thresholds:

# ============================================================
# Evaluation output
# ============================================================

evaluation:

  # Filename for the confusion matrix image Example: confusion_matrix_file: matrix.png
  confusion_matrix_file:

  # Filename for the metrics CSV file. Example: metrics_csv_file: metrics.csv
  metrics_csv_file:

# ============================================================
# Input / Output
# ============================================================

io:

  # Path to the PMTBench index.ttl file
  index: EvaluationExample/index.ttl

  # Output CSV filename
  output: EvaluationExample/split_Csv_1_5.csv